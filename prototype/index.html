<title>Cal-X Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --page:#0b0d11; --bg:#11141a; --card:#1a1f27; --card-2:#222834; --line:#2b3240;
  --text:#ece8e1; --muted:#98a0ad; --accent:#f2a33a; --accent-ink:#1a1206;
  --steel:#86a9c8; --good:#5dbb8a; --warn:#e6b450; --bad:#e36a5c; --locked:#3a414d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --page:#dde1e6; --bg:#eef0f3; --card:#ffffff; --card-2:#f3f5f7; --line:#d5dae0;
  --text:#151a21; --muted:#5b6472; --accent:#c9780f; --accent-ink:#ffffff;
  --steel:#3f6f99; --good:#2f8f5f; --warn:#a87812; --bad:#c2463a; --locked:#c3cad3;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#dde1e6; --bg:#eef0f3; --card:#ffffff; --card-2:#f3f5f7; --line:#d5dae0;
  --text:#151a21; --muted:#5b6472; --accent:#c9780f; --accent-ink:#ffffff;
  --steel:#3f6f99; --good:#2f8f5f; --warn:#a87812; --bad:#c2463a; --locked:#c3cad3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.45 var(--body);display:flex;justify-content:center;align-items:center;padding-inline:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* phone frame */
.phone{position:relative;width:100%;max-width:400px;height:min(820px,calc(100% - 32px));background:var(--bg);border:1px solid var(--line);border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
@media (max-width:500px){body{padding-inline:0}.phone{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0 0 72px;overflow-y:auto;padding:20px 16px 24px}
.full{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;padding:16px}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* type */
h1,h2,h3,.num{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:22px;line-height:1.1}
h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card-2);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--line);font-size:16px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.check.on{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.bar{height:6px;border-radius:6px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:20;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>

<div class="phone" id="phone">
  <div class="screen" id="screen"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="layer"></div>
</div>

<script>
// ---------- data (sample; real app loads this from storage) ----------
const TIERS={F:'Foundation',B:'Beginner',I:'Intermediate',A:'Advanced',E:'Elite'};
// [id, name, type r=reps h=hold, rangeLow, rangeHigh, tier, needsBar, cue]
const TRACKS=[
 {id:'push',name:'Push',nodes:[
  ['incline_pu','Incline push-up','r',8,15,'F',0,'Hands on bricks, body one straight line.'],
  ['knee_pu','Knee push-up','r',8,15,'F',0,'Hips in line with shoulders, chest to floor.'],
  ['pushup','Push-up','r',5,12,'B',0,'Elbows ~45°, ribs down, glutes tight, chest touches floor.'],
  ['deficit_pu','Deficit push-up','r',6,12,'B',0,'On push-up handles; sink chest below hand level.'],
  ['diamond_pu','Diamond push-up','r',6,12,'I',0,'Hands together under chest, elbows brush ribs.'],
  ['archer_pu','Archer push-up','r',4,8,'I',0,'Shift weight to one arm, other arm stays straight.'],
  ['pseudo_pu','Pseudo planche push-up','r',5,10,'A',0,'Hands by hips, lean forward, protract shoulders.'],
  ['oa_pu','One-arm push-up','r',1,5,'E',0,'Wide stance, square hips, slow lowering.']]},
 {id:'pull',name:'Pull',nodes:[
  ['db_row','Dumbbell row','r',8,15,'F',0,'Flat back, pull elbow to hip, pause at top.'],
  ['table_row','Table row','r',6,12,'B',0,'Under a sturdy table. Test it first. Body straight.'],
  ['dead_hang','Dead hang','h',20,60,'B',1,'Full grip, shoulders active, no swinging.'],
  ['neg_pullup','Negative pull-up','r',3,6,'I',1,'Jump to top, lower for 5 seconds.'],
  ['pullup','Pull-up','r',3,10,'I',1,'Dead hang start, chin over bar, no kipping.'],
  ['muscle_up','Muscle-up','r',1,5,'A',1,'Explosive high pull, fast transition over bar.'],
  ['oa_pullup','One-arm pull-up','r',1,3,'E',1,'Years of work. Assisted versions first.']]},
 {id:'legs',name:'Legs',nodes:[
  ['bw_squat','Bodyweight squat','r',15,30,'F',0,'Heels down, knees track toes, hips below knees.'],
  ['split_squat','Split squat','r',8,12,'F',0,'Back knee to floor, front shin vertical.'],
  ['goblet_squat','Goblet squat','r',8,15,'B',0,'Dumbbell at chest, elbows inside knees at bottom.'],
  ['bulgarian','Bulgarian split squat','r',8,12,'I',0,'Rear foot on a chair, torso slightly forward.'],
  ['assist_pistol','Assisted pistol','r',5,10,'I',0,'Hold a door frame or yoga belt, one leg down.'],
  ['pistol','Pistol squat','r',3,8,'A',0,'Free leg straight, full depth, controlled.']]},
 {id:'core',name:'Core',nodes:[
  ['dead_bug','Dead bug','r',8,12,'F',0,'Lower back glued to floor.'],
  ['plank','Plank','h',30,60,'F',0,'Squeeze glutes, push floor away.'],
  ['hollow_hold','Hollow hold','h',15,40,'F',0,'Lower back flat, arms by ears, legs low.'],
  ['tuck_lsit','Tuck L-sit','h',10,20,'B',0,'On bricks or handles, shoulders pushed down.'],
  ['lsit','L-sit','h',10,20,'I',0,'Legs straight and level, toes pointed.'],
  ['vsit','V-sit','h',3,10,'E',0,'Hips behind hands, legs rising above horizontal.']]},
 {id:'handstand',name:'Handstand',nodes:[
  ['pike_pu','Pike push-up','r',5,10,'B',0,'Hips high, head goes in front of hands.'],
  ['elev_pike','Elevated pike push-up','r',5,10,'I',0,'Feet on chair, hands on bricks for depth.'],
  ['ctw_hs','Chest-to-wall handstand','h',20,60,'I',0,'Belly to wall, straight line, push tall.'],
  ['free_hs','Freestanding handstand','h',10,30,'A',0,'Balance with fingers, stack hips over shoulders.'],
  ['hspu','Handstand push-up','r',3,8,'A',0,'Wall-supported, head to a mat, tripod shape.'],
  ['press_hs','Press to handstand','r',1,5,'E',0,'Needs compression + planche lean strength.']]},
 {id:'planche',name:'Planche',nodes:[
  ['pl_lean','Planche lean','h',10,30,'B',0,'Arms straight, lean forward, shoulders past hands.'],
  ['crow','Crow pose (Bakasana)','h',10,30,'B',0,'Also practised on Saturday yoga. Knees high on arms.'],
  ['tuck_pl','Tuck planche','h',5,15,'A',0,'Hips level with shoulders, arms locked.'],
  ['adv_tuck_pl','Advanced tuck planche','h',5,15,'A',0,'Flat back, knees away from chest.'],
  ['straddle_pl','Straddle planche','h',3,10,'E',0,'Legs wide and straight, body horizontal.'],
  ['full_pl','Full planche','h',3,8,'E',0,'Body fully horizontal, legs together.']]},
];
const ACCESSORIES=[
  ['sl_bridge','Single-leg glute bridge','r',8,15,'F',0,'Drive through heel, hips level. Per side.'],
  ['gripper','Grip trainer squeezes','r',10,25,'F',0,'Full close, slow open. Per hand.'],
];
const EX={}; // id -> exercise object
TRACKS.forEach(t=>t.nodes=t.nodes.map((n,i)=>(EX[n[0]]=mk(n,t.id,i))));
ACCESSORIES.forEach(n=>EX[n[0]]=mk(n,null,0));
function mk([id,name,type,lo,hi,tier,bar,cue],track,i){return{id,name,hold:type==='h',lo,hi,tier,bar:!!bar,cue,track,i}}

const DAYS=[ // weekly blueprint from the PDF, Mon..Sun
 {d:'Mon',n:28,kind:'strength',yoga:'Chest & upper-back decompression',eve:'Rest or walk'},
 {d:'Tue',n:29,kind:'yoga',yoga:'Hip mobility & Siddhasana prep',eve:'Run 20–30 min'},
 {d:'Wed',n:30,kind:'strength',yoga:'Spinal twists & side bends',eve:'Rest or walk'},
 {d:'Thu',n:1,kind:'yoga',yoga:'Backbends (spine extension)',eve:'Run 20–30 min'},
 {d:'Fri',n:2,kind:'strength',yoga:'Forward folds (hamstrings & back)',eve:'Rest or walk'},
 {d:'Sat',n:3,kind:'yoga',yoga:'Arm balances (Bakasana) & inversions',eve:'Optional run'},
 {d:'Sun',n:4,kind:'rest',yoga:'Full physical rest, gentle walk',eve:'Rest'},
];

const S={
  tab:'today', day:0, bar:false,
  mastered:new Set(['incline_pu','knee_pu','bw_squat','split_squat','dead_bug','plank']),
  presc:{pushup:7,db_row:11,goblet_squat:10,hollow_hold:20,pike_pu:6,pl_lean:15,sl_bridge:11,gripper:18}, // current targets
  last:{pushup:[7,7,6],db_row:[11,11,10],goblet_squat:[10,10,9],hollow_hold:[20,20,15],pike_pu:[6,6,5],pl_lean:[15,15,10],sl_bridge:[11,11],gripper:[18,17]},
  best:{pushup:7,knee_pu:15,plank:60,hollow_hold:20,goblet_squat:10,pike_pu:6,pl_lean:15,db_row:11},
  checks:{}, readiness:null, rules:{maxRpe:8,failPct:75},
  done:{}, workout:null, sheet:null,
};

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const u=ex=>ex.hold?'s':'';
const setsFor=ex=>ex.track?3:2;
function currentNode(t){ // first unmastered node; fall back to last mastered if blocked by missing bar
  const i=t.nodes.findIndex(n=>!S.mastered.has(n.id));
  if(i<0) return t.nodes.at(-1);
  if(t.nodes[i].bar&&!S.bar&&i>0) return t.nodes[i-1];
  return t.nodes[i];
}
function status(n){
  if(S.mastered.has(n.id)) return 'done';
  const t=TRACKS.find(t=>t.id===n.track);
  if(n.bar&&!S.bar) return 'bar';
  const prev=t.nodes[n.i-1];
  return !prev||S.mastered.has(prev.id)?'current':'locked';
}
function session(){
  const light=S.readiness&&S.readiness.score<50;
  return [...TRACKS.map(currentNode),EX.sl_bridge,EX.gripper].map(ex=>{
    const sets=Math.max(1,setsFor(ex)-(light?1:0));
    return {ex,sets,target:S.presc[ex.id]??ex.lo};
  });
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#phone').append(d);setTimeout(()=>d.remove(),2600)}
// ---------- Today ----------
function checkRow(key,title,sub,extra=''){
  const on=S.checks[S.day+key];
  return `<div class="item"><button class="check ${on?'on':''}" data-a="check" data-v="${key}" aria-label="Mark ${title} done">${on?'✓':''}</button>
    <div style="flex:1"><div style="font-weight:600">${title}</div><div class="small muted">${sub}</div></div>${extra}</div>`;
}
function renderToday(){
  const day=DAYS[S.day], isToday=S.day===0, r=S.readiness;
  const strip=DAYS.map((d,i)=>`<button data-a="day" data-v="${i}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;${i===S.day?'background:var(--card-2);border:1px solid var(--line)':''}">
      <span class="small muted">${d.d[0]}</span><span class="num" style="font-size:20px">${d.n}</span>
      <span style="width:6px;height:6px;border-radius:50%;background:${d.kind==='strength'?'var(--accent)':d.kind==='yoga'?'var(--steel)':'var(--locked)'}"></span></button>`).join('');

  let main;
  if(day.kind==='strength'){
    const ses=session(), done=S.done[S.day];
    const mins=Math.round(ses.reduce((a,s)=>a+s.sets*((s.ex.hold?s.target:s.target*3)+(s.ex.track?90:60)),0)/60);
    main=`<div class="card stack">
      <div class="row between"><div><div class="eyebrow">Strength circuit · 8 exercises</div><h2 style="margin-top:4px">Full body</h2></div>
        <div style="text-align:right"><div class="num" style="font-size:26px">${mins}<span class="small muted"> min</span></div><div class="small muted">+ warm-up & cool-down</div></div></div>
      ${r&&r.score<50?`<div class="chip" style="color:var(--warn)">Lighter session: 1 set fewer each (low readiness)</div>`:''}
      <div class="list">${ses.map(s=>`<button class="item" data-a="node" data-v="${s.ex.id}" style="text-align:left">
          <div style="flex:1"><div style="font-weight:600">${s.ex.name}</div><div class="small muted">${s.ex.track?TIERS[s.ex.tier]+' · '+s.ex.track:'Accessory'}${S.last[s.ex.id]?' · last '+S.last[s.ex.id].join('·')+u(s.ex):''}</div></div>
          <div class="num" style="font-size:20px">${s.sets} × ${s.target}${u(s.ex)}</div></button>`).join('')}</div>
      ${done?`<div class="chip on" style="justify-content:center">✓ Completed</div>`:isToday?`<button class="btn" data-a="start">Start workout</button>`:`<div class="small muted" style="text-align:center">Preview. Targets update after each session.</div>`}
    </div>
    <div class="section"><div class="eyebrow">Warm-up & cool-down</div><div class="card list" style="padding-block:4px">
      ${checkRow('warm','Wrist prep + brick scapular presses','3 min')}
      ${checkRow('sn1','Surya Namaskar · 5 crisp rounds','~4 min, 1 breath per movement')}
      ${checkRow('sn2','Surya Namaskar · 5 slow rounds','~6 min, knees down on the lowering')}
      ${checkRow('ysec',day.yoga,'2–3 deep holds + counterpose, 8–10 min')}
      ${checkRow('shav','Shavasana','5 min')}</div></div>`;
  } else if(day.kind==='yoga'){
    main=`<div class="card stack"><div class="eyebrow">Hatha yoga · 35 min</div><h2>${day.yoga}</h2>
      <div class="small muted">Yoga is a simple check-off for now. Full yoga tracking comes in a later phase.</div>
      <div class="list">${checkRow('yoga','Yoga session done','Main physical work')}</div></div>`;
  } else {
    main=`<div class="card stack"><div class="eyebrow">Rest day</div><h2>Recover</h2><div class="small muted">${day.yoga}. Strength comes from rest days too.</div></div>`;
  }

  const push=currentNode(TRACKS[0]);
  return `<div class="row between"><div><div class="eyebrow">${isToday?'Today':'Plan'}</div><h1 style="margin-top:4px">${day.d} ${day.n} ${S.day<3?'Sep':'Oct'}</h1></div>
      <span class="chip" title="Prototype uses sample data">Demo data</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px">${strip}</div>

    ${isToday&&day.kind==='strength'?`<button class="card row" data-a="checkin" style="margin-top:16px;width:100%;text-align:left">
      ${r?`<div class="num" style="font-size:34px;color:${r.score>=70?'var(--good)':r.score>=50?'var(--warn)':'var(--bad)'}">${r.score}</div><div style="flex:1"><div style="font-weight:600">Readiness</div><div class="small muted">${r.pain?'Pain reported. Avoid painful movements; see a professional if it persists.':r.score>=70?'Good to train as planned.':r.score>=50?'Train as planned, stop 1–2 reps short.':'Lighter session applied.'}</div></div>`
       :`<div style="flex:1"><div style="font-weight:600">How do you feel today?</div><div class="small muted">10-second check-in. Adjusts today's session.</div></div><span class="chip">Check in</span>`}</button>`:''}

    <div class="section">${main}</div>

    ${day.kind==='strength'?`<div class="section"><div class="eyebrow">Next unlock</div><div class="card"><div class="row between"><div style="font-weight:600">${push.name}</div><div class="small muted">goal 3 × ${push.hi}</div></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,Math.round((S.presc[push.id]??push.lo)/push.hi*100))}%"></i></div>
      <div class="small muted" style="margin-top:8px">Master it to unlock <b style="color:var(--text)">${TRACKS[0].nodes[push.i+1]?.name}</b>.</div></div></div>`:''}

    <div class="section"><div class="eyebrow">Daily rhythm</div><div class="card list" style="padding-block:4px">
      ${checkRow('morning','Morning sadhana','Loosening 3m · Pranayama 10m · Dhyana 20–30m')}
      ${checkRow('eve','Evening',day.eve)}
      ${checkRow('night','Night sadhana','3 min slow Nadi Shodhana · Dhyana 20–30m')}</div></div>`;
}

function checkinSheet(){
  const c=S.ci||(S.ci={sleep:2,energy:3,sore:2,pain:false});
  const opts=(k,vals)=>vals.map((l,i)=>`<button class="chip ${c[k]===i?'on':''}" data-a="ci" data-v="${k}:${i}">${l}</button>`).join('');
  return `<h2>Daily check-in</h2>
    <div class="stack"><div class="eyebrow">Sleep</div><div class="row" style="flex-wrap:wrap;gap:6px">${opts('sleep',['<6h','6–7h','7–8h','8h+'])}</div></div>
    <div class="stack"><div class="eyebrow">Energy</div><div class="row" style="flex-wrap:wrap;gap:6px">${opts('energy',['Very low','Low','OK','Good','Great'])}</div></div>
    <div class="stack"><div class="eyebrow">Muscle soreness</div><div class="row" style="flex-wrap:wrap;gap:6px">${opts('sore',['None','Light','Moderate','High','Severe'])}</div></div>
    <button class="item" data-a="ci" data-v="pain:x" style="text-align:left"><span class="check ${c.pain?'on':''}">${c.pain?'✓':''}</span><div><div style="font-weight:600">Any sharp or joint pain?</div><div class="small muted">Cal-X can't diagnose pain. If it's sharp or lasting, see a physio or doctor.</div></div></button>
    <button class="btn" data-a="ci-save">Save</button>`;
}
function readinessScore(c){return Math.round(100*(0.4*[.3,.6,.9,1][c.sleep]+0.35*c.energy/4+0.25*(1-c.sore/4)))}
// ---------- progression rules (explainable, thresholds live in S.rules) ----------
function evaluate({ex,sets,target},vals,rpes,pain){
  const U=u(ex), step=ex.hold?5:1, R=S.rules;
  if(pain) return {tag:'Hold',color:'var(--bad)',next:target,why:'Pain flagged. No progression until it is gone. If it persists, see a physio or doctor.'};
  if(!vals.length) return {tag:'Hold',color:'var(--muted)',next:target,why:'Skipped. No change.'};
  const rpe=Math.max(...rpes), total=vals.reduce((a,b)=>a+b,0), pct=Math.round(total/(sets*target)*100);
  const allHit=vals.length>=sets&&vals.every(v=>v>=target);
  if(allHit&&rpe<=R.maxRpe){
    if(vals.every(v=>v>=ex.hi)){
      const nxt=ex.track&&TRACKS.find(t=>t.id===ex.track).nodes[ex.i+1];
      return {tag:'Level up',color:'var(--good)',advance:nxt,next:target,why:`Every set hit ${ex.hi}${U}, the top of the range, at effort ${rpe}/10 or easier. ${ex.name} is mastered.${nxt?` Next session starts ${nxt.name} at ${nxt.lo}${u(nxt)}.`:''}`};
    }
    const nt=Math.min(ex.hi,target+(vals.every(v=>v>=target+2*step)?2*step:step));
    return {tag:'Increase',color:'var(--accent)',next:nt,why:`All ${sets} sets reached ${target}${U} at effort ${rpe}/10 (limit ${R.maxRpe}). Target goes up to ${nt}${U}.`};
  }
  if(allHit) return {tag:'Hold',color:'var(--warn)',next:target,why:`Target hit, but effort ${rpe}/10 is above ${R.maxRpe}. Repeat ${target}${U} until it feels controlled.`};
  if(pct<R.failPct){
    const nt=Math.max(ex.lo,target-step);
    return {tag:'Ease off',color:'var(--bad)',next:nt,why:`${total}${U} of ${sets*target}${U} planned (${pct}%) is below the ${R.failPct}% floor. ${nt<target?`Target drops to ${nt}${U}.`:'Already at the range floor. Keep it, or switch to the easier variation.'}`};
  }
  return {tag:'Hold',color:'var(--warn)',next:target,why:`${total}${U} of ${sets*target}${U} planned (${pct}%). Close enough to keep ${target}${U}. Aim to hit every set next time.`};
}

function completeSet(){
  const w=S.workout, it=w.items[w.i];
  w.logs[w.i].push(w.val); w.rpes[w.i].push(w.rpe);
  const doneEx=w.logs[w.i].length>=it.sets;
  if(doneEx&&w.i===w.items.length-1) return finish();
  if(doneEx){w.i++; w.val=w.items[w.i].target; w.rpe=7}
  const n=w.items[w.i];
  w.restNext=`${n.ex.name}, set ${w.logs[w.i].length+1} · ${n.target}${u(n.ex)||' reps'}`;
  w.rest=Date.now()+(it.ex.track?90:60)*1000;
  draw();
}
function nextExercise(){const w=S.workout; if(w.i===w.items.length-1) return finish(); w.i++; w.val=w.items[w.i].target; w.rpe=7; draw()}
function finish(){
  const w=S.workout;
  w.results=w.items.map((it,k)=>({it,vals:w.logs[k],res:evaluate(it,w.logs[k],w.rpes[k],w.pain[k])}));
  w.mins=Math.max(1,Math.round((Date.now()-w.t0)/60000)); w.rest=null; w.summary=true; draw();
}
function renderSummary(){

function saveWorkout(){
  const w=S.workout;

    if(vals.length){S.last[id]=vals; S.best[id]=Math.max(S.best[id]??0,...vals)}
    S.presc[id]=res.next;

  });
  S.done[S.day]=true; S.workout=null; draw();
}
function tick(){
  const w=S.workout; if(!w) return;

  'rest-add':()=>S.workout.rest+=15000,
  'rest-skip':()=>S.workout.rest=null,
  skip:()=>{nextExercise();return 1},
  pain:()=>{const w=S.workout;w.pain[w.i]=true;toast('Noted. Stop this exercise. Cal-X can\'t diagnose pain. If it\'s sharp or lasts, see a professional.');nextExercise();return 1},
  save:saveWorkout,
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]'); if(!t) return;
  if(t.dataset.a==='close'&&e.target!==t) return;
  if(!A[t.dataset.a](t.dataset.v)) draw()});
document.addEventListener('input',e=>{const k=e.target.dataset.rule; if(!k) return; S.rules[k]=+e.target.value; $('#rv-'+k).textContent=k==='maxRpe'?e.target.value+'/10':e.target.value+'%'});
setInterval(tick,250);
draw();
</script>
